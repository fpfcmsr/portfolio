# Project site on GitHub Pages: https://<user>.github.io/<repo>/
# Change baseURL only if you move to a custom domain or an org/user site.
baseURL = 'https://fpfcmsr.github.io/portfolio/'
locale = 'en-US'
defaultContentLanguage = 'en'
title = 'Francesco Fortunelli'

theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = 'Francesco Fortunelli — software engineering portfolio.'
  author = 'Francesco Fortunelli'

  # auto | light | dark
  defaultTheme = 'auto'
  disableThemeToggle = false

  # Consumed by the site's own header and home layouts.
  [params.links]
    github = 'https://github.com/fpfcmsr'
    linkedin = 'https://www.linkedin.com/in/fpfcmsr/'

  # Project pages only; the home page is custom-built.
  ShowReadingTime = true
  ShowWordCount = false
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = false

[[menu.main]]
  identifier = 'projects'
  name = 'Projects'
  url = '/projects/'
  weight = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false

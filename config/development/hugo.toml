# Used by 'hugo server' (HUGO_ENVIRONMENT=development).
# Mirrors production: the custom domain serves the site at the root,
# so local URLs are http://localhost:1313/... (no /portfolio/ prefix).
baseURL = 'http://localhost:1313/'

# Show draft projects while working locally, so new entries from
# `hugo new content projects/<name>/index.md` are visible immediately.
# Production builds (`hugo`, CI) ignore this file and still exclude drafts.
buildDrafts = true
